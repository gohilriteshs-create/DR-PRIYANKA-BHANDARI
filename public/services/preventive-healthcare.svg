<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="prevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="pCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#prevBg)" />

  <!-- Ambient Light Pattern -->
  <circle cx="200" cy="180" r="160" fill="#34d399" opacity="0.12" />
  <circle cx="620" cy="400" r="200" fill="#38bdf8" opacity="0.12" />

  <!-- Workspace Card -->
  <g filter="url(#pCardShadow)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff" fill-opacity="0.97" />
    <rect x="70" y="70" width="660" height="460" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Top Bar -->
  <rect x="70" y="70" width="660" height="75" rx="24" fill="#f8fafc" />
  <line x1="70" y1="145" x2="730" y2="145" stroke="#e2e8f0" stroke-width="1.5" />

  <g transform="translate(105, 95)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#d1fae5" />
    <circle cx="14" cy="14" r="5" fill="#059669" />
    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46" letter-spacing="0.5">PREVENTIVE HEALTHCARE</text>

    <rect x="232" y="0" width="185" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="246" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#047857">Early Risk Stratification</text>

    <rect x="510" y="2" width="80" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <text x="550" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">ANNUAL</text>
  </g>

  <!-- Left: Health Screening Dashboard & Lab Biomarkers -->
  <g transform="translate(105, 175)">
    <rect x="0" y="0" width="280" height="315" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Comprehensive Screening Panel</text>
    <text x="20" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Metabolic, Cardiovascular &amp; Lifestyle Markers</text>
    <line x1="20" y1="60" x2="260" y2="60" stroke="#e2e8f0" stroke-width="1" />

    <!-- Metric 1: Blood Sugar / HbA1c -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#ecfdf5" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Fasting Blood Glucose</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">92 mg/dL · Optimal Range</text>
      <text x="225" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="end">NORMAL</text>
    </g>

    <!-- Metric 2: Lipid Profile -->
    <g transform="translate(20, 127)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#ecfdf5" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Lipid Profile &amp; Cholesterol</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">HDL/LDL Ratio Screened</text>
      <text x="225" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="end">NORMAL</text>
    </g>

    <!-- Metric 3: Liver & Kidney Profile -->
    <g transform="translate(20, 179)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#ecfdf5" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Hepatic &amp; Renal Functions</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Creatinine, SGPT Baseline</text>
      <text x="225" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="end">NORMAL</text>
    </g>

    <!-- Metric 4: Vitamin & Mineral Status -->
    <g transform="translate(20, 231)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#e0f2fe" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Vitamin D3 &amp; B12 Screen</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Replenishment Protocol</text>
      <text x="225" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0284c7" text-anchor="end">OPTIMIZED</text>
    </g>

    <!-- Footer Note -->
    <rect x="20" y="280" width="240" height="24" rx="6" fill="#ecfdf5" />
    <text x="140" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">ANNUAL HEALTH REPORT COMPLIANT</text>
  </g>

  <!-- Right: Shield Icon & Medical Cross & Heart Rate Wave -->
  <g transform="translate(420, 175)">
    <!-- Big Protective Shield -->
    <path d="M135 15 C205 15, 255 35, 255 105 C255 195, 175 255, 135 285 C95 255, 15 195, 15 105 C15 35, 65 15, 135 15 Z" 
          fill="url(#shieldGrad)" filter="url(#pCardShadow)" />

    <!-- Inner Shield Line -->
    <path d="M135 28 C195 28, 240 45, 240 105 C240 185, 170 240, 135 268 C100 240, 30 185, 30 105 C30 45, 75 28, 135 28 Z" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

    <!-- Heart & Cross In Center -->
    <g transform="translate(95, 90)">
      <!-- Medical Cross -->
      <rect x="30" y="0" width="20" height="70" rx="6" fill="#ffffff" />
      <rect x="5" y="25" width="70" height="20" rx="6" fill="#ffffff" />
      
      <!-- Stethoscope Wrapped Around -->
      <circle cx="40" cy="35" r="48" fill="none" stroke="#34d399" stroke-width="6" stroke-dasharray="8 6" />
    </g>

    <text x="135" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      PROACTIVE PROTECTION
    </text>
    <text x="135" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#d1fae5" text-anchor="middle">
      Detect Risk Factors Before Symptoms
    </text>

    <!-- Lower Summary Card -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="270" height="42" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5" />
      <circle cx="24" cy="21" r="10" fill="#0f766e" />
      <path d="M20 21 L23 24 L29 18" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="44" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f766e">
        Personalized Lifestyle Guidance
      </text>
    </g>
  </g>
</svg>
