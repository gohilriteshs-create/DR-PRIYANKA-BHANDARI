<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="stethoMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#031b29" flood-opacity="0.35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Wallpaper -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Medical Cross Grid in Backdrop -->
  <g opacity="0.08" fill="#ffffff">
    <path d="M120 80 h20 v20 h-20 z M110 90 h40 v-20 h-40 z" />
    <path d="M680 120 h20 v20 h-20 z M670 130 h40 v-20 h-40 z" />
    <path d="M220 220 h20 v20 h-20 z M210 230 h40 v-20 h-40 z" />
    <path d="M720 380 h20 v20 h-20 z M710 390 h40 v-20 h-40 z" />
    <path d="M80 420 h20 v20 h-20 z M70 430 h40 v-20 h-40 z" />
  </g>

  <!-- Ambient Light Circles -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="650" cy="450" r="220" fill="#2dd4bf" opacity="0.1" filter="url(#softGlow)" />

  <!-- Central Doctor's Consultation Workspace Glass Panel -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff" fill-opacity="0.96" />
    <rect x="70" y="70" width="660" height="460" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Top Banner Inside Workspace -->
  <rect x="70" y="70" width="660" height="75" rx="24" fill="#f8fafc" />
  <line x1="70" y1="145" x2="730" y2="145" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Bar Badges -->
  <g transform="translate(105, 95)">
    <!-- Hospital & Practitioner Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#e0f2fe" />
    <circle cx="14" cy="14" r="5" fill="#0284c7" />
    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.5">PRIMARY MEDICAL CARE</text>

    <rect x="232" y="0" width="165" height="28" rx="14" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" />
    <text x="246" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f766e">Hinduja Hospital</text>

    <!-- Room Status -->
    <rect x="500" y="2" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <circle cx="512" cy="14" r="3.5" fill="#10b981" />
    <text x="522" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">CLINIC OPEN</text>
  </g>

  <!-- Left Side: Clinical Examination Chart & Clipboard -->
  <g transform="translate(105, 175)">
    <!-- Clipboard Board -->
    <rect x="0" y="0" width="260" height="315" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <!-- Clip -->
    <rect x="90" y="-12" width="80" height="24" rx="6" fill="#64748b" />
    <rect x="105" y="-6" width="50" height="12" rx="3" fill="#94a3b8" />

    <!-- Paper Sheet -->
    <rect x="16" y="24" width="228" height="270" rx="8" fill="#ffffff" />
    
    <!-- Medical Rx Symbol Header -->
    <text x="32" y="58" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#0284c7">℞</text>
    <text x="64" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">General Consultation</text>
    <text x="64" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Vitals &amp; Diagnostic Protocol</text>
    
    <line x1="32" y1="82" x2="228" y2="82" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Checklist rows with checkmarks -->
    <g transform="translate(32, 98)">
      <circle cx="10" cy="10" r="9" fill="#e0f2fe" />
      <path d="M6 10 L9 13 L15 7" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="28" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Blood Pressure (120/80 mmHg)</text>
    </g>

    <g transform="translate(32, 134)">
      <circle cx="10" cy="10" r="9" fill="#e0f2fe" />
      <path d="M6 10 L9 13 L15 7" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="28" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">SpO2 Oxygen Saturation (99%)</text>
    </g>

    <g transform="translate(32, 170)">
      <circle cx="10" cy="10" r="9" fill="#e0f2fe" />
      <path d="M6 10 L9 13 L15 7" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="28" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Pulse &amp; Heart Auscultation</text>
    </g>

    <g transform="translate(32, 206)">
      <circle cx="10" cy="10" r="9" fill="#e0f2fe" />
      <path d="M6 10 L9 13 L15 7" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="28" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Systemic Physical Assessment</text>
    </g>

    <!-- Doctor Stamp & Signature Box -->
    <rect x="32" y="240" width="196" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3" />
    <path d="M44 262 Q 60 250, 78 260 T 110 258 T 135 264" fill="none" stroke="#0284c7" stroke-width="1.8" />
    <text x="145" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0f766e">VERIFIED</text>
  </g>

  <!-- Right Side: Stethoscope, Tablet Monitor & Diagnostic Pulse -->
  <g transform="translate(395, 175)">
    <!-- Digital Monitor Tablet -->
    <rect x="0" y="0" width="300" height="190" rx="18" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <rect x="12" y="12" width="276" height="166" rx="10" fill="#090d16" />

    <!-- Pulse Header -->
    <text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CARDIAC MONITOR</text>
    <circle cx="260" cy="34" r="4" fill="#22c55e" />

    <!-- Live ECG Rhythm Wave -->
    <path d="M26 95 L70 95 L80 82 L90 115 L102 45 L116 135 L126 95 L170 95 L180 82 L190 115 L202 45 L216 135 L226 95 L270 95" 
          fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Monitor Metrics -->
    <g transform="translate(26, 130)">
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">BPM</text>
      <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">72</text>

      <text x="80" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">BP SYS/DIA</text>
      <text x="80" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">120/80</text>

      <text x="180" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">TEMP</text>
      <text x="180" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">98.6°</text>
    </g>

    <!-- Professional Acoustic Stethoscope Curved Over Desk -->
    <g transform="translate(20, 195)">
      <!-- Tubing -->
      <path d="M 60 40 C 60 90, 120 110, 170 85 C 220 60, 240 90, 240 120" 
            fill="none" stroke="url(#tubeGrad)" stroke-width="12" stroke-linecap="round" />
      <path d="M 60 40 C 60 90, 120 110, 170 85 C 220 60, 240 90, 240 120" 
            fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />

      <!-- Binaural Metal Tubes -->
      <path d="M 30 10 L 60 40 L 90 10" fill="none" stroke="url(#stethoMetal)" stroke-width="7" stroke-linecap="round" />
      <circle cx="28" cy="8" r="6" fill="#334155" />
      <circle cx="92" cy="8" r="6" fill="#334155" />

      <!-- Chest Piece / Stethoscope Bell -->
      <circle cx="240" cy="120" r="26" fill="url(#stethoMetal)" stroke="#64748b" stroke-width="2" filter="url(#cardShadow)" />
      <circle cx="240" cy="120" r="18" fill="#e2e8f0" stroke="#0284c7" stroke-width="2" />
      <circle cx="240" cy="120" r="7" fill="#0369a1" />
    </g>
  </g>

  <!-- Bottom Accent Tag -->
  <g transform="translate(415, 480)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#e0f2fe" />
    <text x="140" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">
      PHYSICIAN CLINICAL ASSESSMENT · IN-CLINIC
    </text>
  </g>
</svg>
