<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="famBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="familyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="fCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0c2e42" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#famBg)" />

  <!-- Ambient Light Pattern -->
  <circle cx="220" cy="180" r="180" fill="#38bdf8" opacity="0.15" />
  <circle cx="620" cy="420" r="200" fill="#f59e0b" opacity="0.12" />

  <!-- Workspace Card -->
  <g filter="url(#fCardShadow)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff" fill-opacity="0.97" />
    <rect x="70" y="70" width="660" height="460" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Top Bar -->
  <rect x="70" y="70" width="660" height="75" rx="24" fill="#f0f9ff" />
  <line x1="70" y1="145" x2="730" y2="145" stroke="#bae6fd" stroke-width="1.5" />

  <g transform="translate(105, 95)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#e0f2fe" />
    <circle cx="14" cy="14" r="5" fill="#0284c7" />
    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1" letter-spacing="0.5">FAMILY &amp; PEDIATRIC CARE</text>

    <rect x="232" y="0" width="180" height="28" rx="14" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="246" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400e">All Age Groups &amp; Children</text>

    <rect x="500" y="2" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="545" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">FAMILY FIRST</text>
  </g>

  <!-- Left: Family Clinical Care Elements -->
  <g transform="translate(105, 175)">
    <rect x="0" y="0" width="280" height="315" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Pediatric &amp; Household Wellness</text>
    <text x="20" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Continuous Care Across Generations</text>
    <line x1="20" y1="60" x2="260" y2="60" stroke="#e2e8f0" stroke-width="1" />

    <!-- Item 1: Growth & Milestone Monitoring -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#e0f2fe" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Child Growth &amp; Height Tracking</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Pediatric Growth Velocity &amp; Vitals</text>
    </g>

    <!-- Item 2: Seasonal Allergies & Respiratory -->
    <g transform="translate(20, 127)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#fef3c7" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Seasonal Fevers &amp; Respiratory</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Cough, Asthma &amp; Allergy Relief</text>
    </g>

    <!-- Item 3: Immunization & Vaccine Guidance -->
    <g transform="translate(20, 179)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#ecfdf5" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Immunization Chart Advice</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Vaccination Catch-up &amp; Booster Tips</text>
    </g>

    <!-- Item 4: Nutritional Assessment -->
    <g transform="translate(20, 231)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#e0f2fe" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Adolescent Nutrition &amp; Care</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Balanced Macro &amp; Micronutrients</text>
    </g>

    <!-- Footer Note -->
    <rect x="20" y="280" width="240" height="24" rx="6" fill="#e0f2fe" />
    <text x="140" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">GENTLE · CHILD-FRIENDLY APPROACH</text>
  </g>

  <!-- Right: Family Silhouette in Protective Heart Circle -->
  <g transform="translate(420, 175)">
    <circle cx="135" cy="140" r="125" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />
    <circle cx="135" cy="140" r="105" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="8 6" />

    <!-- Family Silhouette Characters -->
    <g transform="translate(135, 140)">
      <!-- Mother Silhouette -->
      <g transform="translate(-40, -45)">
        <circle cx="0" cy="0" r="12" fill="#0284c7" />
        <path d="M-15 16 C-15 45, 15 45, 15 16 Z" fill="#0284c7" />
      </g>
      <!-- Father Silhouette -->
      <g transform="translate(40, -50)">
        <circle cx="0" cy="0" r="13" fill="#0369a1" />
        <path d="M-16 18 C-16 50, 16 50, 16 18 Z" fill="#0369a1" />
      </g>
      <!-- Child Silhouette in Center -->
      <g transform="translate(0, -10)">
        <circle cx="0" cy="0" r="10" fill="#10b981" />
        <path d="M-12 12 C-12 36, 12 36, 12 12 Z" fill="#10b981" />
      </g>
      <!-- Protective Stethoscope Arms Underneath -->
      <path d="M-70 30 C-30 65, 30 65, 70 30" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
      <circle cx="-70" cy="30" r="8" fill="#d97706" />
      <circle cx="70" cy="30" r="8" fill="#d97706" />
    </g>

    <text x="135" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">
      WHOLE-FAMILY HEALTHCARE
    </text>
    <text x="135" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">
      Pediatric to Geriatric Consultations
    </text>

    <!-- Badge -->
    <g transform="translate(10, 312)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">
        Reassuring, Gentle Pediatric Consultations
      </text>
    </g>
  </g>
</svg>
