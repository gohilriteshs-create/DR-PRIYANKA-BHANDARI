<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="folBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="folCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#folBg)" />

  <!-- Ambient Light Pattern -->
  <circle cx="200" cy="180" r="180" fill="#60a5fa" opacity="0.15" />
  <circle cx="620" cy="400" r="200" fill="#38bdf8" opacity="0.12" />

  <!-- Workspace Card -->
  <g filter="url(#folCardShadow)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff" fill-opacity="0.97" />
    <rect x="70" y="70" width="660" height="460" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Top Bar -->
  <rect x="70" y="70" width="660" height="75" rx="24" fill="#eff6ff" />
  <line x1="70" y1="145" x2="730" y2="145" stroke="#dbeafe" stroke-width="1.5" />

  <g transform="translate(105, 95)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#dbeafe" />
    <circle cx="14" cy="14" r="5" fill="#2563eb" />
    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.5">CONTINUITY OF CARE</text>

    <rect x="232" y="0" width="180" height="28" rx="14" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" />
    <text x="246" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f766e">Lab Review &amp; Follow-up</text>

    <rect x="500" y="2" width="90" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="545" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">ACTIVE CARE</text>
  </g>

  <!-- Left: Medical Follow-up Report Review -->
  <g transform="translate(105, 175)">
    <rect x="0" y="0" width="280" height="315" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Clinical Recovery Progress</text>
    <text x="20" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Treatment Response &amp; Titration</text>
    <line x1="20" y1="60" x2="260" y2="60" stroke="#e2e8f0" stroke-width="1" />

    <!-- Item 1: Symptom Resolution Assessment -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#eff6ff" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Symptom Resolution</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Fever &amp; Acute Ailments Resolved</text>
    </g>

    <!-- Item 2: Diagnostic Lab Report Review -->
    <g transform="translate(20, 127)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#eff6ff" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Lab Report Verification</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">CBC, Thyroid &amp; Urine Parameters</text>
    </g>

    <!-- Item 3: Dosage Adjustment / Step Down -->
    <g transform="translate(20, 179)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#eff6ff" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Medication Course Review</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Step-down / Maintenance Dosing</text>
    </g>

    <!-- Item 4: Long-Term Wellness Planning -->
    <g transform="translate(20, 231)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#eff6ff" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e293b">Next Review Milestone</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Digital Reminders &amp; Tele-care</text>
    </g>

    <!-- Footer Note -->
    <rect x="20" y="280" width="240" height="24" rx="6" fill="#eff6ff" />
    <text x="140" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">COMPLETE RECOVERY SAFEGUARD</text>
  </g>

  <!-- Right: Calendar Follow-up & Stethoscope Loop -->
  <g transform="translate(420, 175)">
    <circle cx="135" cy="140" r="125" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
    <circle cx="135" cy="140" r="105" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="8 6" />

    <!-- Calendar Card in Center -->
    <g transform="translate(85, 80)">
      <rect x="0" y="0" width="100" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#folCardShadow)" />
      <!-- Top Red/Blue Header -->
      <path d="M0 14 C0 6, 6 0, 14 0 L86 0 C94 0, 100 6, 100 14 L100 32 L0 32 Z" fill="#2563eb" />
      <!-- Binder Rings -->
      <rect x="20" y="-5" width="6" height="12" rx="3" fill="#64748b" />
      <rect x="74" y="-5" width="6" height="12" rx="3" fill="#64748b" />
      <text x="50" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">FOLLOW-UP</text>
      
      <!-- Big Date with Checkmark -->
      <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#1e293b" text-anchor="middle">07</text>
      <text x="50" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">DAYS POST CARE</text>
      <circle cx="82" cy="42" r="8" fill="#10b981" />
      <path d="M78 42 L81 45 L86 39" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <text x="135" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">
      IN-PERSON &amp; TELE-HEALTH
    </text>
    <text x="135" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">
      Ensuring Full Treatment Effectiveness
    </text>

    <!-- Badge -->
    <g transform="translate(10, 312)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">
        Seamless Lab &amp; Scan Reviews
      </text>
    </g>
  </g>
</svg>
