<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="womenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="wCardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4c0519" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#womenBg)" />

  <!-- Ambient Light Pattern -->
  <circle cx="220" cy="180" r="180" fill="#f472b6" opacity="0.12" />
  <circle cx="600" cy="400" r="220" fill="#38bdf8" opacity="0.12" />

  <!-- Card Panel -->
  <g filter="url(#wCardShadow)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff" fill-opacity="0.97" />
    <rect x="70" y="70" width="660" height="460" rx="24" fill="none" stroke="#fbcfe8" stroke-width="2" />
  </g>

  <!-- Top Bar -->
  <rect x="70" y="70" width="660" height="75" rx="24" fill="#fff1f2" />
  <line x1="70" y1="145" x2="730" y2="145" stroke="#fecdd3" stroke-width="1.5" />

  <g transform="translate(105, 95)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#fce7f3" />
    <circle cx="14" cy="14" r="5" fill="#db2777" />
    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9d174d" letter-spacing="0.5">WOMEN’S HEALTHCARE (CGO)</text>

    <rect x="232" y="0" width="195" height="28" rx="14" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" />
    <text x="246" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#be185d">Gynecology &amp; Maternal Care</text>

    <rect x="500" y="2" width="90" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <text x="545" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">CONFIDENTIAL</text>
  </g>

  <!-- Left: Clinical Modules List -->
  <g transform="translate(105, 175)">
    <rect x="0" y="0" width="280" height="315" rx="16" fill="#fffafb" stroke="#fce7f3" stroke-width="1.5" />

    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#831843">Specialized Care Modules</text>
    <text x="20" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#9d174d">Personalized &amp; Empathetic Clinical Support</text>
    <line x1="20" y1="60" x2="260" y2="60" stroke="#fbcfe8" stroke-width="1" />

    <!-- Item 1: Menstrual & Hormonal Balance -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#fce7f3" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4c0519">Hormonal &amp; Cycle Harmony</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9d174d">PCOS, Thyroid &amp; Cycle Support</text>
    </g>

    <!-- Item 2: Preconception & Maternal Wellness -->
    <g transform="translate(20, 127)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#fce7f3" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4c0519">Preconception &amp; Maternal Care</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9d174d">Folic Acid, Nutrition &amp; Trimester Tips</text>
    </g>

    <!-- Item 3: Anemia & Bone Mineral Density -->
    <g transform="translate(20, 179)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#fce7f3" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4c0519">Anemia &amp; Bone Health (D3/Ca)</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9d174d">Hemoglobin &amp; Calcium Optimization</text>
    </g>

    <!-- Item 4: Perimenopausal & Senior Women Care -->
    <g transform="translate(20, 231)">
      <rect x="0" y="0" width="240" height="42" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="1" />
      <circle cx="20" cy="21" r="10" fill="#fce7f3" />
      <path d="M16 21 L19 24 L25 17" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4c0519">Menopausal &amp; Vitality Support</text>
      <text x="38" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9d174d">Vasomotor, Mood &amp; Heart Care</text>
    </g>

    <!-- Footer Note -->
    <rect x="20" y="280" width="240" height="24" rx="6" fill="#fce7f3" />
    <text x="140" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#831843" text-anchor="middle">CERTIFIED GYNECOLOGY &amp; OBSTETRICS</text>
  </g>

  <!-- Right: Lotus Harmony Motif & Protective Stethoscope Ring -->
  <g transform="translate(420, 175)">
    <!-- Decorative Circle Container -->
    <circle cx="135" cy="140" r="125" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2" />
    <circle cx="135" cy="140" r="100" fill="#ffffff" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Lotus Petal Emblem Center -->
    <g transform="translate(135, 130)">
      <!-- Center Petal -->
      <path d="M0 -50 C-18 -20 -20 15 0 28 C20 15 18 -20 0 -50 Z" fill="url(#lotusGrad)" />
      <!-- Left Petals -->
      <path d="M-8 -30 C-38 -15 -42 12 -12 26 C-6 12 -4 -15 -8 -30 Z" fill="#f472b6" opacity="0.9" />
      <path d="M-15 -10 C-50 5 -45 30 -20 30 C-15 20 -12 10 -15 -10 Z" fill="#ec4899" opacity="0.75" />
      <!-- Right Petals -->
      <path d="M8 -30 C38 -15 42 12 12 26 C6 12 4 -15 8 -30 Z" fill="#f472b6" opacity="0.9" />
      <path d="M15 -10 C50 5 45 30 20 30 C15 20 12 10 15 -10 Z" fill="#ec4899" opacity="0.75" />
      <!-- Base Lotus Leaves -->
      <path d="M-30 28 Q 0 42 30 28 Q 0 35 -30 28 Z" fill="#059669" />
    </g>

    <!-- Stethoscope Heart Ribbon -->
    <path d="M75 220 Q 135 255 195 220 Q 135 295 75 220 Z" fill="#db2777" opacity="0.15" />

    <text x="135" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#831843" text-anchor="middle" letter-spacing="0.5">
      EMPATHETIC &amp; RESPECTFUL
    </text>
    <text x="135" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#9d174d" text-anchor="middle">
      Dr. Priyanka Bhandari · CGO Practitioner
    </text>

    <!-- Badge -->
    <g transform="translate(10, 312)">
      <rect x="0" y="0" width="250" height="38" rx="10" fill="#fce7f3" stroke="#f472b6" stroke-width="1" />
      <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9d174d" text-anchor="middle">
        Safe · Private · Unhurried
      </text>
    </g>
  </g>
</svg>
